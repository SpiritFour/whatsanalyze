name: Build and Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and Build 🔧
        id: build
        run: |
          pnpm install --frozen-lockfile
          pnpm generate
          echo "build_id=$(jq -r .id dist/_nuxt/builds/latest.json)" >> "$GITHUB_OUTPUT"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: dist # The folder the action should deploy.
      - name: Sentry Release
        uses: getsentry/action-release@v1.1.5
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: live
          sourcemaps: "./dist"

  # GitHub Pages publishes a minute or so after the push to gh-pages, so this
  # waits until the site reports the build above before touching the backend.
  deploy-functions:
    needs: deploy-live
    uses: ./.github/workflows/deploy-functions.yml
    with:
      project: default
      before: ${{ github.event.before }}
      wait_for_build_url: https://whatsanalyze.com/_nuxt/builds/latest.json
      build_id: ${{ needs.deploy-live.outputs.build_id }}
    secrets:
      credentials: ${{ secrets.FUNCTIONS_DEPLOYER_WHATSANALYZE_80665 }}
