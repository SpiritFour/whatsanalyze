env:
  browser: true
  node: true
root: true
extends:
  - "eslint:recommended"
  #  - "@nuxtjs/eslint-config-typescript"
  - "plugin:vue/recommended"
  - "prettier"
parser: "vue-eslint-parser"
parserOptions:
  parser: "@typescript-eslint/parser"
  ecmaVersion: 12
  sourceType: module
plugins:
  - vue
globals:
  defineI18nConfig: readonly
  defineNuxtConfig: readonly
  defineNuxtPlugin: readonly
  queryCollection: readonly
  useAsyncData: readonly
  useRuntimeConfig: readonly
  useSeoMeta: readonly
  useI18n: readonly
  useSwitchLocalePath: readonly
  navigateTo: readonly
  computed: readonly
  ref: readonly
  useHead: readonly
  useLocalePath: readonly
  defineProps: readonly
  definePageMeta: readonly
  useSharedChat: readonly
  useRoute: readonly
  useRouter: readonly
  useNuxtApp: readonly
  useAnalytics: readonly
  useState: readonly
  useOneTimePurchase: readonly
  restoreOneTimePurchase: readonly
  persistOneTimePurchase: readonly
  rememberOneTimeCheckoutChat: readonly
  unlocksChat: readonly
  toRaw: readonly
  defineEmits: readonly
  onMounted: readonly
rules:
  vue/no-multiple-template-root: "off"
